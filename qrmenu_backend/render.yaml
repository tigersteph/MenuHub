services:
  - type: web
    name: qrmenu-backend
    env: node
    rootDir: qrmenu_backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Database configuration (to be set in Render dashboard)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_POOL_MAX
        value: 20
      - key: DB_POOL_MIN
        value: 2
      - key: DB_POOL_IDLE_TIMEOUT
        value: 30000
      - key: DB_POOL_CONNECTION_TIMEOUT
        value: 2000
      # JWT configuration
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1h
      # CORS and Frontend
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Redis configuration
      - key: REDIS_ENABLED
        value: true
      - key: REDIS_URL
        sync: false
      # Cloudinary configuration
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Rate limiting
      - key: ORDER_RATE_LIMIT_MAX
        value: 100
      - key: AUTH_RATE_LIMIT_MAX
        value: 5
      - key: GENERAL_RATE_LIMIT_MAX
        value: 100
      # Email (disabled for free tier)
      - key: EMAIL_ENABLED
        value: false
      # Swagger (disabled in production)
      - key: ENABLE_SWAGGER
        value: false

